# Required checks on main are the job names below: lint, typecheck, unit, e2e.
# Never rename them, and never add paths filters: a required check that never runs blocks PRs forever.
name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { cache: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { cache: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  unit:
    name: unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { cache: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # Visual baselines are generated in this same image (Pitfall 6); keep the tag equal to @playwright/test.
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --user 1001
    env:
      VISUAL: "1"
      # Pager specs also run in Firefox and WebKit (the container ships all three browsers).
      ALL_BROWSERS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { cache: true }
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm measure:js -- --max-gzip-kb 150
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
